<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 30px auto; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 8px; }
        h2 { text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, button { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; border: none; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        ul { list-style-type: none; padding: 0; }
        li { padding: 10px; background: #f9f9f9; margin-bottom: 5px; border-left: 5px solid #dc3545; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { width: auto; padding: 2px 8px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 10px; font-size: 12px; }
        .delete-btn:hover { background-color: #c82333; }
        .total { font-size: 18px; font-weight: bold; text-align: right; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>💰 Expense Tracker</h2>
    
    <div class="form-group">
        <label for="desc">Description</label>
        <input type="text" id="desc" placeholder="e.g., Groceries, Coffee, Rent">
    </div>
    
    <div class="form-group">
        <label for="amount">Amount (\$)</label>
        <input type="number" id="amount" placeholder="0.00">
    </div>
    
    <button onclick="addExpense()">Add Expense</button>

    <h3>History</h3>
    <ul id="expense-list"></ul>

    <div class="total">Total: \$<span id="total-amount">0.00</span></div>

    <script>
        // Load expenses from local storage when page opens
        let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

        // Display saved items on startup
        updateUI();

        function addExpense() {
            const desc = document.getElementById('desc').value;
            const amount = parseFloat(document.getElementById('amount').value);
            
            if (desc === '' || isNaN(amount) || amount <= 0) {
                alert('Please enter a valid description and amount.');
                return;
            }

            // Create expense object
            const expense = {
                id: Date.now(),
                desc: desc,
                amount: amount
            };

            // Add to array and save
            expenses.push(expense);
            localStorage.setItem('expenses', JSON.stringify(expenses));

            // Update UI & clear inputs
            updateUI();
            document.getElementById('desc').value = '';
            document.getElementById('amount').value = '';
        }

        function deleteExpense(id) {
            // Remove the selected item
            expenses = expenses.filter(expense => expense.id !== id);
            localStorage.setItem('expenses', JSON.stringify(expenses));
            updateUI();
        }

        function updateUI() {
            const list = document.getElementById('expense-list');
            list.innerHTML = '';
            let total = 0;

            expenses.forEach(expense => {
                total += expense.amount;
                
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${expense.desc}</span> 
                    <span>
                        $${expense.amount.toFixed(2)}
                        <button class="delete-btn" onclick="deleteExpense(${expense.id})">❌</button>
                    </span>
                `;
                list.appendChild(li);
            });

            document.getElementById('total-amount').innerText = total.toFixed(2);
        }
    </script>
</body>
</html>
